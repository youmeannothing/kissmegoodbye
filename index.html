<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiss Me Goodbye — 조각글</title>
  <meta name="description" content="발췌문과 조각글을 쓰는 작은 워드 프로세서">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Noto+Serif+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/css/batang.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <div class="sheet">
    <header>
      <div class="t">조각글</div>
      <div class="st">kiss me goodbye :: 흘러가기 전에 붙잡아 둔 문장들</div>
    </header>

    <div class="grp">
      <div class="workspace">
      <div class="paper">
        <div class="doc-toolbar" id="toolbar">
          <button type="button" data-cmd="undo" title="되돌리기">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
          </button>
          <button type="button" data-cmd="redo" title="다시 실행">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
          </button>
          <span class="tb-sep" aria-hidden="true"></span>
          <select id="font-select" class="tb-select" title="글꼴">
            <option value="Pretendard Variable" selected>프리텐다드</option>
            <option value="Noto Serif KR">본명조</option>
            <option value="Nanum Myeongjo">나눔명조</option>
            <option value="KoPubWorld Batang">코펍바탕</option>
            <option value="Gowun Batang">고운바탕</option>
            <option value="Nanum Gothic Coding">타자기</option>
          </select>
          <input type="number" id="size-input" class="tb-num-input tb-size" min="6" max="200" step="0.5" value="11.5" title="글자 크기 (px) — 숫자를 바꾸면 선택한 글자에 적용">
          <span class="tb-sep" aria-hidden="true"></span>
          <button type="button" data-cmd="bold" title="굵게 ⌘B"><b>B</b></button>
          <button type="button" data-cmd="italic" title="기울임 ⌘I"><i>I</i></button>
          <button type="button" data-cmd="underline" title="밑줄 ⌘U"><u>U</u></button>
          <button type="button" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
          <span class="hl-wrap">
            <button type="button" id="hl-btn" class="tb-hl" title="형광펜 — 색을 고르세요">형광</button>
            <span id="hl-palette" class="hl-palette" hidden>
              <button type="button" data-hl="rgb(251, 244, 206)" style="background:#FBF4CE" title="노랑"></button>
              <button type="button" data-hl="rgb(244, 231, 233)" style="background:#F4E7E9" title="분홍"></button>
              <button type="button" data-hl="rgb(227, 240, 228)" style="background:#E3F0E4" title="초록"></button>
              <button type="button" data-hl="rgb(226, 236, 246)" style="background:#E2ECF6" title="파랑"></button>
              <button type="button" data-hl="rgb(236, 230, 244)" style="background:#ECE6F4" title="보라"></button>
              <label class="hl-custom" title="직접 고르기"><input type="color" id="hl-color" value="#fbf4ce"></label>
              <button type="button" data-hl="transparent" class="hl-clear" title="형광 지우기">✕</button>
            </span>
          </span>
          <span class="hl-wrap">
            <button type="button" id="fc-btn" class="fc-btn" title="글자 색">가</button>
            <span id="fc-palette" class="hl-palette" hidden>
              <button type="button" data-fc="#3c434b" style="background:#3c434b" title="기본"></button>
              <button type="button" data-fc="#8A3440" style="background:#8A3440" title="버건디"></button>
              <button type="button" data-fc="#8b939c" style="background:#8b939c" title="회색"></button>
              <button type="button" data-fc="#3F5E9E" style="background:#3F5E9E" title="파랑"></button>
              <button type="button" data-fc="#4A7A4E" style="background:#4A7A4E" title="초록"></button>
              <button type="button" data-fc="#B0762E" style="background:#B0762E" title="갈색"></button>
              <label class="hl-custom" title="직접 고르기"><input type="color" id="fc-color" value="#8a3440"></label>
            </span>
          </span>
          <span class="tb-sep" aria-hidden="true"></span>
          <button type="button" data-cmd="justifyLeft" title="왼쪽 정렬">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h10M3 18h14"/></svg>
          </button>
          <button type="button" data-cmd="justifyCenter" title="가운데 정렬">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M7 12h10M5 18h14"/></svg>
          </button>
          <button type="button" data-cmd="justifyRight" title="오른쪽 정렬">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M11 12h10M7 18h14"/></svg>
          </button>
          <span class="tb-sep" aria-hidden="true"></span>
          <button type="button" id="file-btn" title="파일 삽입 — 이미지는 문서 안에, txt는 커서 위치에">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="f-file" accept="image/*,.txt,.md" hidden>
          <button type="button" id="tbox-btn" title="텍스트 상자 — 드래그로 어디든 옮길 수 있어요">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" stroke-dasharray="3 2.5"/><path d="M9 10h6M12 10v5"/></svg>
          </button>
          <span class="tb-sep" aria-hidden="true"></span>
          <label class="tb-num"><span>종이</span><input type="number" id="width-input" min="280" max="2000" step="10" placeholder="자동" title="종이 폭 (px) — 비우면 자동"></label>
          <label class="tb-num"><span>줄간</span><input type="number" id="lh-input" min="1" max="4" step="0.05" value="1.85" title="줄 간격 (배수)"></label>
          <label class="tb-num"><span>자간</span><input type="number" id="ls-input" min="-0.1" max="0.5" step="0.01" value="0" title="자간 (em)"></label>
          <span class="tb-count"><b id="char-count">0</b>자</span>
        </div>

        <div id="f-body" class="doc-body" contenteditable="true"></div>

        <div class="doc-status">
          <button type="button" class="btn btn-solid" id="save-btn">저장</button>
          <button type="button" class="btn" id="clear-btn">새로 쓰기</button>
          <span class="status-hint"><span id="draft-note" hidden>임시 저장됨 &nbsp;·&nbsp; </span>⌘S 로도 저장됩니다</span>
        </div>
      </div>

      <aside class="paper preview-pane" aria-label="미리보기">
        <div class="pv-bar">미리보기<span class="pv-note">저장하면 이렇게 보입니다</span></div>
        <div id="p-body" class="pv-page v-body"></div>
      </aside>
      </div>
    </div>

    <div class="grp">
      <div class="gh">보관함<span class="gh-note"><b id="piece-count">0</b>편 · 최근 것부터</span></div>
      <ol id="piece-list" class="piece-list"></ol>
      <p id="empty-state" class="empty">아직 보관한 조각이 없습니다.</p>
    </div>

    <div class="corner">
      모든 글은 이 브라우저에만 저장됩니다 &nbsp;·&nbsp;
      <button type="button" id="export-btn" class="corner-link">전체 내보내기</button>
      &nbsp;·&nbsp;
      <button type="button" id="import-btn" class="corner-link">가져오기</button>
      <input type="file" id="f-import" accept=".json" hidden>
      <br>♪ <span class="ph">&nbsp;&nbsp;Angela Aki&nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;Kiss Me Good-Bye</span>
    </div>
  </div>

  <dialog id="view-dialog" class="view-dialog">
    <div class="v-head">
      <div id="v-meta" class="v-meta"></div>
      <button type="button" id="v-close" class="v-close" aria-label="닫기">✕</button>
    </div>
    <div id="v-body" class="v-body"></div>
    <div class="v-actions">
      <button type="button" id="v-edit" class="btn">수정</button>
      <button type="button" id="v-download" class="btn">.txt 내려받기</button>
      <button type="button" id="v-del" class="btn btn-danger">삭제</button>
    </div>
  </dialog>

  <script src="app.js?v=5"></script>
</body>
</html>
